<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pencil & Paper Mobile Word Search</title>
    <style>
        :root {
            --paper-bg: #f4efe6;
            --pencil-dark: #2b2b2b;
            --pencil-light: #7a7a7a;
            --grid-line: #d1c7b7;
            --highlight: rgba(61, 220, 132, 0.35);
            --android-green: #3DDC84;
        }

        body {
            background-color: var(--paper-bg);
            background-image: 
                radial-gradient(var(--grid-line) 1.5px, transparent 1.5px),
                radial-gradient(var(--grid-line) 1.5px, var(--paper-bg) 1.5px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            color: var(--pencil-dark);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            touch-action: none; /* Crucial for preventing default touch scrolling during word swipe */
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 12px 0;
            letter-spacing: 2px;
            border-bottom: 3px dashed var(--pencil-dark);
            padding-bottom: 6px;
            text-transform: uppercase;
            text-align: center;
        }

        /* Screen Controller */
        .screen {
            display: none;
            width: 100%;
            max-width: 480px;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        /* Start Screen Styling */
        .start-card {
            background: rgba(255, 255, 255, 0.9);
            border: 4px solid var(--pencil-dark);
            border-radius: 12px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.2);
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .start-card h2 {
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-card p {
            margin: 0;
            font-size: 1rem;
            color: var(--pencil-light);
            line-height: 1.4;
        }

        .doodle-box {
            font-size: 2.5rem;
            letter-spacing: 8px;
            background: var(--paper-bg);
            border: 2px dashed var(--pencil-dark);
            padding: 10px;
            border-radius: 8px;
            width: 80%;
        }

        .btn-start {
            background: var(--android-green);
            border: 3px solid var(--pencil-dark);
            color: #ffffff;
            text-shadow: 1px 1px 0px var(--pencil-dark);
            padding: 12px 28px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--pencil-dark);
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .btn-start:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--pencil-dark);
        }

        /* Game Screen Layout */
        .game-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 480px;
            align-items: center;
            position: relative;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            padding: 0 4px;
        }

        .status-bar {
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-new-puzzle {
            background: var(--paper-bg);
            border: 2px solid var(--pencil-dark);
            color: var(--pencil-dark);
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--pencil-dark);
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }

        .btn-new-puzzle:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--pencil-dark);
        }

        .btn-new-puzzle:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Grid Board */
        .grid-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            background: var(--pencil-dark);
            padding: 6px;
            border: 4px solid var(--pencil-dark);
            border-radius: 8px;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.2);
            width: 100%;
            box-sizing: border-box;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--paper-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.1s ease;
        }

        .cell.selected {
            background: var(--highlight);
            border: 2px solid var(--android-green);
        }

        .cell.found {
            background: var(--android-green) !important;
            color: #ffffff;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.3);
            pointer-events: none;
            border: none;
        }

        /* Target Words Panel */
        .word-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 3px dashed var(--pencil-dark);
            padding: 12px 16px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        .panel-title {
            font-size: 0.95rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .word-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 120px;
            overflow-y: auto;
        }

        .word-item {
            font-size: 1.05rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(244, 239, 230, 0.8);
            border: 1px solid var(--pencil-light);
            transition: all 0.2s ease;
        }

        .word-item.found {
            background: var(--android-green);
            color: #ffffff;
            text-decoration: line-through;
            border-color: var(--android-green);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.15);
        }

        /* Full Width Confetti Overlay */
        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: 999;
        }

        .confetti-piece {
            position: absolute;
            top: -20px;
            width: 10px;
            height: 14px;
            opacity: 0.9;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 40px)) rotate(720deg);
                opacity: 0.2;
            }
        }
    </style>
</head>

    <div id="confetti-container"></div>

    // Web Audio API context setup
    let audioCtx = null;
    let scribbleNode = null;
    let scribbleGain = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playScribbleStart() {
        initAudio();
        if (!audioCtx) return;

        // Pink noise buffer for gentle pencil scratching
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        
        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
            data[i] *= 0.04; // Reduced output level for a quieter sound
            b6 = white * 0.115926;
        }

        scribbleNode = audioCtx.createBufferSource();
        scribbleNode.buffer = buffer;
        scribbleNode.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1800;
        filter.Q.value = 1.2;

        scribbleGain = audioCtx.createGain();
        // Soft volume setting (0.12 gain)
        scribbleGain.gain.setValueAtTime(0.12, audioCtx.currentTime);

        scribbleNode.connect(filter);
        filter.connect(scribbleGain);
        scribbleGain.connect(audioCtx.destination);

        scribbleNode.start();
    }

    function stopScribble() {
        if (scribbleGain && audioCtx) {
            scribbleGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.03);
            setTimeout(() => {
                if (scribbleNode) {
                    try { scribbleNode.stop(); } catch(e){}
                    scribbleNode.disconnect();
                    scribbleNode = null;
                }
            }, 60);
        }
    }

        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        // 1. Initial "POP" - High pitch burst quickly dropping
        const popOsc = audioCtx.createOscillator();
        const popGain = audioCtx.createGain();
        popOsc.type = 'sine';
        popOsc.frequency.setValueAtTime(800, now);
        popOsc.frequency.exponentialRampToValueAtTime(120, now + 0.08);

        popGain.gain.setValueAtTime(0.7, now);
        popGain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        popOsc.connect(popGain);
        popGain.connect(audioCtx.destination);
        popOsc.start(now);
        popOsc.stop(now + 0.08);

        // 2. Low Springy Thump (Pressure release)
        const thumpOsc = audioCtx.createOscillator();
        const thumpGain = audioCtx.createGain();
        thumpOsc.type = 'triangle';
        thumpOsc.frequency.setValueAtTime(160, now);
        thumpOsc.frequency.exponentialRampToValueAtTime(45, now + 0.18);

        thumpGain.gain.setValueAtTime(0.6, now);
        thumpGain.gain.linearRampToValueAtTime(0.01, now + 0.18);

        thumpOsc.connect(thumpGain);
        thumpGain.connect(audioCtx.destination);
        thumpOsc.start(now);
        thumpOsc.stop(now + 0.18);

        // 3. Shimmering Paper / Streamer Flutter Noise
        const noiseBufferSize = audioCtx.sampleRate * 0.35;
        const noiseBuffer = audioCtx.createBuffer(1, noiseBufferSize, audioCtx.sampleRate);
        const noiseData = noiseBuffer.getChannelData(0);
        for (let i = 0; i < noiseBufferSize; i++) {
            noiseData[i] = Math.random() * 2 - 1;
        }

        const noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = noiseBuffer;

        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.setValueAtTime(1200, now);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.5, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

        noiseNode.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        noiseNode.start(now);
        noiseNode.stop(now + 0.35);
    }

    function startGame() {
        initAudio();
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        initGame();
    }

    function initGame() {
        let keys = Object.keys(dictionary).filter(w => w.length <= 7);
        let shuffled = keys.sort(() => 0.5 - Math.random());
        currentWords = shuffled.slice(0, 5);
        
        foundWordsCount = 0;
        document.getElementById('score-display').innerText = `Found: 0 / ${currentWords.length}`;
        
        const btnNew = document.getElementById('btn-new');
        btnNew.disabled = false;

        generateGrid();
        renderWordList();
    }

    function generateGrid() {
        gridData = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));

        const directions = [
            {r: 0, c: 1},   // Horizontal right
            {r: 1, c: 0},   // Vertical down
            {r: 1, c: 1},   // Diagonal down-right
            {r: 1, c: -1}   // Diagonal down-left
        ];

        currentWords.forEach(word => {
            let placed = false;
            let attempts = 0;
            while (!placed && attempts < 100) {
                attempts++;
                let dir = directions[Math.floor(Math.random() * directions.length)];
                let row = Math.floor(Math.random() * GRID_SIZE);
                let col = Math.floor(Math.random() * GRID_SIZE);

                let endRow = row + dir.r * (word.length - 1);
                let endCol = col + dir.c * (word.length - 1);

                if (endRow >= 0 && endRow < GRID_SIZE && endCol >= 0 && endCol < GRID_SIZE) {
                    let fit = true;
                    for (let i = 0; i < word.length; i++) {
                        let r = row + dir.r * i;
                        let c = col + dir.c * i;
                        if (gridData[r][c] !== '' && gridData[r][c] !== word[i]) {
                            fit = false;
                            break;
                        }
                    }
                    if (fit) {
                        for (let i = 0; i < word.length; i++) {
                            let r = row + dir.r * i;
                            let c = col + dir.c * i;
                            gridData[r][c] = word[i];
                        }
                        placed = true;
                    }
                }
            }
        });

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                if (gridData[r][c] === '') {
                    gridData[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
                }
            }
        }

        renderGridDOM();
    }

    function renderGridDOM() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.innerText = gridData[r][c];

                cell.addEventListener('mousedown', (e) => startSwipe(r, c, e));
                cell.addEventListener('mouseenter', (e) => continueSwipe(r, c, e));
                
                cell.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    startSwipe(r, c, e);
                }, {passive: false});
                
                cell.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    let touch = e.touches[0];
                    let target = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (target && target.classList.contains('cell')) {
                        continueSwipe(parseInt(target.dataset.row), parseInt(target.dataset.col), e);
                    }
                }, {passive: false});

                gridEl.appendChild(cell);
            }
        }

        window.addEventListener('mouseup', endSwipe);
        window.addEventListener('touchend', endSwipe);
    }

    function renderWordList() {
        const listEl = document.getElementById('word-list');
        listEl.innerHTML = '';
        currentWords.forEach(word => {
            const li = document.createElement('li');
            li.className = 'word-item';
            li.id = `word-${word}`;
            li.innerText = word;
            listEl.appendChild(li);
        });
    }

    function startSwipe(r, c, e) {
        isSwiping = true;
        startCell = {r, c};
        playScribbleStart();
        updateSwipeSelection(r, c);
    }

    function continueSwipe(r, c, e) {
        if (!isSwiping || !startCell) return;
        updateSwipeSelection(r, c);
    }

    function updateSwipeSelection(r, c) {
        let dr = r - startCell.r;
        let dc = c - startCell.c;
        let steps = Math.max(Math.abs(dr), Math.abs(dc));

        if (steps > 0) {
            if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return;
        }

        let stepR = steps === 0 ? 0 : dr / steps;
        let stepC = steps === 0 ? 0 : dc / steps;

        currentSwipeCells = [];
        for (let i = 0; i <= steps; i++) {
            let currR = Math.round(startCell.r + stepR * i);
            let currC = Math.round(startCell.c + stepC * i);
            currentSwipeCells.push({r: currR, c: currC, val: gridData[currR][currC]});
        }

        document.querySelectorAll('.cell').forEach(cell => {
            if (!cell.classList.contains('found')) {
                cell.classList.remove('selected');
            }
        });

        currentSwipeCells.forEach(sc => {
            let targetCell = document.querySelector(`.cell[data-row='${sc.r}'][data-col='${sc.c}']`);
            if (targetCell && !targetCell.classList.contains('found')) {
                targetCell.classList.add('selected');
            }
        });
    }

    function endSwipe() {
        if (!isSwiping) return;
        isSwiping = false;
        stopScribble();

        let selectedWord = currentSwipeCells.map(cell => cell.val).join('');
        let reversedWord = currentSwipeCells.map(cell => cell.val).reverse().join('');

        currentWords.forEach(word => {
            let wordLi = document.getElementById(`word-${word}`);
            if ((selectedWord === word || reversedWord === word) && wordLi && !wordLi.classList.contains('found')) {
                wordLi.classList.add('found');
                currentSwipeCells.forEach(sc => {
                    let targetCell = document.querySelector(`.cell[data-row='${sc.r}'][data-col='${sc.c}']`);
                    if (targetCell) {
                        targetCell.classList.remove('selected');
                        targetCell.classList.add('found');
                    }
                });
                foundWordsCount++;
                document.getElementById('score-display').innerText = `Found: ${foundWordsCount} / ${currentWords.length}`;

                if (foundWordsCount === currentWords.length) {
                    triggerWinSequence();
                }
            }
        });

        currentSwipeCells = [];
        startCell = null;
        document.querySelectorAll('.cell.selected').forEach(c => c.classList.remove('selected'));
    }

    function triggerWinSequence() {
        playConfettiPopperSound();
        
        const btnNew = document.getElementById('btn-new');
        btnNew.disabled = true;

        launchConfetti();

        // Re-enable "New Puzzle" button after full fall sequence finishes
        setTimeout(() => {
            btnNew.disabled = false;
        }, 2200);
    }

    function launchConfetti() {
        const container = document.getElementById('confetti-container');
        container.innerHTML = '';

        const colors = ['#3DDC84', '#e67e22', '#3498db', '#e74c3c', '#f1c40f', '#9b59b6'];
        const particleCount = 65;

        for (let i = 0; i < particleCount; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            
            // Full screen width distribution (0vw to 100vw)
            piece.style.left = `${Math.random() * 100}vw`;
            piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            const duration = 1.4 + Math.random() * 0.8;
            piece.style.animationDuration = `${duration}s`;
            
            const delay = Math.random() * 0.35;
            piece.style.animationDelay = `${delay}s`;

            container.appendChild(piece);
        }

        setTimeout(() => {
            container.innerHTML = '';
        }, 2600);
    }
</script>
